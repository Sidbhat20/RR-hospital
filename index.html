<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf8f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RR Hospitals" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>RR Hospitals · Finance & Records</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="description" content="RR Hospitals — chat-first finance and records system, moving the hospital from paper registers to a live digital ledger." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <div class="mark" aria-hidden="true">RR</div>
      <div><div class="brand-name">RR Hospitals</div><div class="brand-sub">Finance & Records</div></div>
    </div>
    <button class="new-chat" data-act="new-chat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat<span class="kbd">⌘K</span></button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="nav-label" id="logs-label">Chats</div>
    <div class="logs" id="logs"></div>
    <div class="side-foot">
      <div class="avatar" aria-hidden="true">A</div>
      <div class="who"><b>Asim</b><span>RR Hospitals</span></div>
      <button class="icon-btn" data-act="reset" title="Reset demo data" aria-label="Reset demo data" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
  </aside>
  <div class="scrim side-scrim" id="side-scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" aria-label="Open navigation"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb"><span class="parent">RR Hospitals</span><span class="parent" aria-hidden="true">/</span><b id="crumb">Ask</b></div>
      <button class="icon-btn m-only" id="m-new" data-act="new-chat" aria-label="New chat" title="New chat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="seg period" id="period" role="group" aria-label="Period"></div>
      <button class="ask-trigger" id="ask-trigger" data-act="ask"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span id="ask-ph">Ask</span><span class="kbd">⌘K</span></button>
      <button class="icon-btn" id="dock-toggle" data-act="dock" aria-label="Toggle chat panel" aria-pressed="false" title="Chat panel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M15 3v18"/></svg></button>
    </header>
    <div class="scroll" id="scroll"></div>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </main>

  <aside class="dock" id="dock" aria-label="Chat panel">
    <div class="dock-h">
      <div class="mark" aria-hidden="true" style="width:24px;height:24px;border-radius:6px;font-size:10px">RR</div>
      <b>Chat</b><span class="sp"></span>
      <button class="icon-btn" data-act="new-chat" title="New chat" aria-label="New chat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" data-nav="copilot" title="Open full screen" aria-label="Open chat full screen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
      <button class="icon-btn" data-act="dock-close" title="Close" aria-label="Close chat panel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="dock-body" id="dock-body"></div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>
<form class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog" novalidate>
  <div class="drawer-h">
    <div><h2 id="drawer-title"></h2><p id="drawer-sub"></p></div>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-b" id="drawer-body"></div>
  <div class="drawer-f" id="drawer-foot"></div>
</form>
<div class="sheet" id="more" role="dialog" aria-modal="true" aria-label="More" aria-hidden="true">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-b" id="more-body"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="iso.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="intents.js"></script>
<script src="copilot.js"></script>
<script src="doctors.js"></script>
<script src="talk.js"></script>
<script src="pages.js"></script>
<script src="samples/scans.js"></script>
<script src="finance.js"></script>
<script src="pages2.js"></script>
<script src="forms.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
